{% extends "users/basic.html" %} <!--For normal webpages — you use (% extends %) because you want the navbar, footer and all common stuff from basic.html.-->

{% block content %} <!--So from here you continue to write things which belongs to this file-->
<h1>Movies</h1>
<ul>
    {% for movie in  movies%}
    <li>
        <img src="{{movie.image.url}} alt = "image>
        <strong>{{movie.name}}</strong>{{movie.rating}}
        <p>Cast:{{movie.cast}}</p>
        <a href = "{% url 'theater_list' movie.id %}">View Theaters</a>
    </li>
    {% endfor %}
</ul>    
{% endblock %}
